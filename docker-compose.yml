version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: used-marketplace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-used_marketplace}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - used_marketplace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  used_marketplace_data: