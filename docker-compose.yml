version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: used-marketplace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: used_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - used_marketplace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  used_marketplace_data:
