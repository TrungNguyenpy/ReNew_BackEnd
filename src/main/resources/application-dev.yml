server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/used_marketplace
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # schema managed by Flyway migrations, not Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.usedmarket: DEBUG
    org.hibernate.SQL: DEBUG
